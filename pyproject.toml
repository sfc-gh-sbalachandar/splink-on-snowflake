[project]
name = "splink-on-snowflake"
version = "1.0.0"
description = "Run Splink record linkage on Snowflake via Snowpark Connect for Spark"
requires-python = ">=3.9,<3.13"

dependencies = [
    "snowpark-connect",
    "splink>=4,<5",
    "pyspark==3.5.*",
    "pandas>=2,<3",
    "pyarrow>=14",
]
